name: Mac and Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android Build Tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Install Windows video tools
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install native GDRE Tools
        run: python tools/ci_install_gdre.py
      - name: Run tests including real signing and Regenesis conversion
        env:
          ANDROID4X3_REQUIRE_NATIVE_TESTS: '1'
        run: python -m pytest -ra
      - name: Compile Python modules
        run: python -m compileall -q src games patch.py
      - name: Exercise Mac launcher
        if: runner.os == 'macOS'
        run: ./patch.sh --list-games
      - name: Exercise PowerShell launcher
        if: runner.os == 'Windows'
        run: ./patch.ps1 --list-games
      - name: Exercise Windows Command Prompt launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: patch.bat --list-games
